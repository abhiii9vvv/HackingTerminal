<!DOCTYPE html>
<!-- Ye HTML5 document hai, browser ko batata hai ki ye modern HTML hai -->
<html lang="en">
  <!-- HTML tag shuru hota hai, language English set hai -->
  <head>
    <!-- Head section - yaha pe page ki information hoti hai jo display nahi hoti -->
    <meta charset="UTF-8" />
    <!-- UTF-8 character encoding - sabhi languages ko support karta hai -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mobile responsive banane ke liye, screen size adjust karta hai -->
    <title>Hacker's Terminal</title>
    <!-- Browser tab pe dikhne wala title -->
    <link rel="stylesheet" href="style.css" />
    <!-- External CSS file ko link karta hai styling ke liye -->
  </head>
  <body>
    <!-- Body tag - yaha actual content dikhta hai jo user dekhta hai -->
    <div class="container">
      <!-- Container div - saare content ko wrap karta hai -->
      <h1>Welcome to Hacker's Terminal</h1>
      <!-- Main heading - sabse bada heading text -->
      <div id="terminal"></div>
      <!-- Terminal div - yaha JavaScript se messages add honge, ID se access karenge -->
    </div>
    <div class="watermark">made by av9</div>
    <script src="script.js"></script>
    <!-- JavaScript file ko load karta hai - functionality ke liye -->
  </body>
</html>
